<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Horarios del Médico</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body class="container mt-5">
    <h2 class="mb-4">Horarios de Atención</h2>

    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Día</th>
          <th>Hora de Inicio</th>
          <th>Hora de Fin</th>
          <th>Ver Citas</th>
        </tr>
      </thead>
      <tbody>
        {% for horario in horarios %}
        <tr>
          <td>{{ horario.dia }}</td>
          <td>{{ horario.hora_inicio }}</td>
          <td>{{ horario.hora_fin }}</td>
          <td>
            <a
              href="{{ url_for('horariosM.ver_citas_dia', id_medico=id_medico, dia=horario.dia|trim) }}"
              >Ver citas</a
            >
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="4" class="text-center">No hay horarios registrados.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <a href="{{ url_for('main.index_Medico') }}" class="btn btn-primary"
      >Volver</a
    >
  </body>
</html>
