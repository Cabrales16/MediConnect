<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil</title>
    <link rel="stylesheet" href="../static/perfil.css" />
    <!-- Añadir Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="profile-container">
      <h2>Mi Perfil</h2>
      <!-- Ícono de usuario en grande -->
      <i class="fas fa-user profile-icon"></i>

      <!-- Información del usuario -->
      <div class="profile-item">
        <i class="fas fa-user"></i>
        <span>Usuario:</span> {{ session['usuario']['nombre_completo'] }}
      </div>
      <div class="profile-item">
        <i class="fas fa-envelope"></i>
        <span>Correo:</span> {{ session['usuario']['correo'] }}
      </div>

      <!-- Botón para volver al inicio -->
      <a href="{{ url_for('auth.pagina_principal') }}" class="btn-back"
        >Volver a Inicio</a
      >
    </div>
  </body>
</html>
