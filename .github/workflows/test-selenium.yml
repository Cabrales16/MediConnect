name: Pruebas Selenium

on:
  push:
    branches: [ "develop", "prueba_gitactions" ]
  pull_request:
    branches: [ "develop", "prueba_gitactions" ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # o la versión que uses

      # Si tus tests usan webdriver_manager y modo headless,
      # puedes omitir esta parte. Si no, instalar navegador/driver:
      # - name: Instalar Chromium y Chromedriver
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y chromium-browser chromium-chromedriver
      #     echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
      #     echo "CHROMEDRIVER_PATH=/usr/bin/chromedriver" >> $GITHUB_ENV

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas Selenium
        run: |
          mkdir -p reportes
          pytest test/test_login.py \
            --html=reportes/reporte_$(date +%Y-%m-%d_%H-%M-%S).html \
            --self-contained-html

      - name: Subir reporte HTML como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-selenium
          path: reportes/*.html
