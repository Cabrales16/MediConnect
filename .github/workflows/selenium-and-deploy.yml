name: Pruebas Selenium y Deploy a Railway

on:
  push:
    branches: ["develop"]     # Solo en develop
  pull_request:
    branches: ["develop"]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    env:
      # URL pública del frontend en GitHub Pages
      FRONTEND_URL: https://cabrales16.github.io/MediConnect/

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de backend (producción + pruebas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-tests.txt

      - name: Ejecutar pruebas Selenium
        run: |
          mkdir -p reportes
          pytest test/test_login.py \
            --html=reportes/reporte_$(date +%Y-%m-%d_%H-%M-%S).html \
            --self-contained-html

      - name: Subir reporte HTML como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-selenium
          path: reportes/*.html   # working-directory ya es backend

  deploy:
    needs: selenium-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    container: ghcr.io/railwayapp/cli:latest

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar a Railway
        run: |
          railway up --service=$RAILWAY_SERVICE_ID
