name: Pruebas Selenium y Deploy a Railway

on:
  push:
    branches: [ "*" ]        # Ajusta aquí si quieres usar otra rama para producción
  pull_request:
    branches: [ "develop" ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend   # seguimos usando el backend como raíz

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 🔹 NUEVO: instalar MariaDB Connector/C para que el paquete mariadb se pueda compilar
      - name: Instalar dependencias del sistema (MariaDB Connector/C)
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev

      - name: Instalar dependencias de backend (producción)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependencias de pruebas (Selenium)
        run: |
          pip install -r requirements-tests.txt

      - name: Ejecutar pruebas Selenium
        run: |
          mkdir -p reportes
          pytest test/test_login.py \
            --html=reportes/reporte_$(date +%Y-%m-%d_%H-%M-%S).html \
            --self-contained-html

      - name: Subir reporte HTML como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-selenium
          path: backend/reportes/*.html
