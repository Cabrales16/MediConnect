name: Pruebas Selenium y Deploy a Railway

on:
  push:
    branches: [ "*" ]        # Ajusta aquí si quieres usar otra rama para producción
  pull_request:
    branches: [ "develop" ]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    # Opcional pero cómodo: todo lo que sea "run" se ejecuta dentro de /backend
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de backend (producción)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar dependencias de pruebas (Selenium)
        run: |
          pip install -r requirements-tests.txt

      - name: Ejecutar pruebas Selenium
        run: |
          mkdir -p reportes
          pytest test/test_login.py \
            --html=reportes/reporte_$(date +%Y-%m-%d_%H-%M-%S).html \
            --self-contained-html

      - name: Subir reporte HTML como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reporte-selenium
          # Como el working-directory es backend, el path es relativo a backend
          path: backend/reportes/*.html

  deploy:
    needs: selenium-tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar a Railway
        run: |
          railway up --service=$RAILWAY_SERVICE_ID
